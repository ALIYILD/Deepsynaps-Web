[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The Deepy assistant endpoint. `_deepy/` is skipped by Netlify's function
# discovery (a leading underscore), so those modules are bundled into
# deepy.mjs by esbuild rather than deployed as endpoints of their own.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The canonical domain is deepsynaps.ai. Force www -> apex, and force the old
# .com domain (both www and apex) onto it: deepsynaps.com stays owned by the
# company and becomes the Clinical Intelligence product domain, so anyone
# arriving at the marketing site through the old name is moved, permanently,
# to the new one. E-mail on @deepsynaps.com is unaffected — that is DNS, not
# HTTP, and nothing here touches it.
[[redirects]]
  from = "https://www.deepsynaps.ai/*"
  to = "https://deepsynaps.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://deepsynaps.com/*"
  to = "https://deepsynaps.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.deepsynaps.com/*"
  to = "https://deepsynaps.ai/:splat"
  status = 301
  force = true

# People type /contact. There is no such page — consultations is where the
# booking and the contact details live — so send them there permanently rather
# than letting the SPA fallback hand them a 404 shaped like a home page.
[[redirects]]
  from = "/contact"
  to = "/consultations"
  status = 301

# SPA fallback — must come last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (refs ALIYILD/DeepSynaps-Clinical-Intelligence-OS#4493).
# Only headers that cannot break the site: the CSP is REPORT-ONLY until AppSec
# has reviewed it and it has been measured on deepsynaps.ai. HSTS is already
# sent by Netlify, so it is deliberately not repeated here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), browsing-topics=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
