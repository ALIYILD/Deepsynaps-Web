<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSynaps AI Lab | Adaptive World Intelligence Model (AWIM)</title>
    <meta name="description" content="DeepSynaps AI Lab is developing AWIM, the Adaptive World Intelligence Model, connecting sensing, world models, NERVE specialist agents, memory and evaluated learning." />
    <meta name="theme-color" content="#050A14" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DeepSynaps AI Lab" />
    <meta property="og:title" content="DeepSynaps AI Lab | Adaptive World Intelligence Model (AWIM)" />
    <meta property="og:description" content="DeepSynaps AI Lab is developing AWIM, the Adaptive World Intelligence Model, connecting sensing, world models, NERVE specialist agents, memory and evaluated learning." />
    <meta property="og:image" content="https://deepsynaps.ai/logo.png" />

    <link rel="canonical" href="https://deepsynaps.ai/" />

    <!-- Tells search engines how this site relates to the company's product:
         the AI Lab is part of DeepSynaps, whose main site is the Clinical
         Intelligence OS at app.deepsynaps.com. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "DeepSynaps AI Lab",
        "url": "https://deepsynaps.ai/",
        "logo": "https://deepsynaps.ai/logo.png",
        "parentOrganization": {
          "@type": "Organization",
          "name": "DeepSynaps",
          "url": "https://app.deepsynaps.com/"
        }
      }
    </script>

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!-- A plain link that does not depend on JavaScript, so crawlers that do
         not run the app still find the product site. -->
    <noscript>
      <p>
        DeepSynaps AI Lab is the research arm of DeepSynaps. The clinical product is the
        <a href="https://app.deepsynaps.com/">DeepSynaps Clinical Intelligence OS</a>.
      </p>
    </noscript>

    <!-- Static form for Netlify Forms build-time detection.
         The real form lives in src/pages/Consultations.tsx and submits via fetch. -->
    <form name="consultations" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="organization" />
      <select name="service">
        <option value="ai-protocol"></option>
        <option value="neuromodulation"></option>
        <option value="qeeg-review"></option>
        <option value="clinic-integration"></option>
        <option value="research"></option>
        <option value="other"></option>
      </select>
      <select name="timeline">
        <option value="urgent"></option>
        <option value="2-weeks"></option>
        <option value="1-month"></option>
        <option value="flexible"></option>
      </select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
