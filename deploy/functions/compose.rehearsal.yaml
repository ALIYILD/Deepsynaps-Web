name: deepsynaps-web-deepy-rehearsal
services:
  deepy:
    image: node:24@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e
    command: ["node", "/srv/server.mjs"]
    user: "1000:1000"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    environment:
      FUNCTION_MODE: rehearsal
      PUBLIC_ORIGIN: https://deepsynaps.ai
      BIND_HOST: 0.0.0.0
      PORT: "8384"
    volumes:
      - ./server.mjs:/srv/server.mjs:ro
    networks: [private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8384/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 4s
      retries: 3
networks:
  private:
    internal: true
